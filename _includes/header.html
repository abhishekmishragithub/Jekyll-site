<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  {% assign description = page.description | default: site.description | strip_html | normalize_whitespace %}
  <meta name="description" content="{{ description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:image" content="{{ '/assets/img/abhishek_mishra_001.jpeg' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@stalwartcoder">
  <meta name="theme-color" content="#f7f5ef">
  <link rel="icon" href="{{ '/assets/portfolio/brick.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
  {% feed_meta %}
</head>
